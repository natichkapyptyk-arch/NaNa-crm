<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запис до салону</title>
<style>
:root{--bg:#F1F4F7;--card:#fff;--ink:#1D2430;--mut:#6B7686;--line:#DDE3EA;--acc:#2C7A74;--bad:#B8435F;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141A21;--card:#1D252E;--ink:#E8EDF2;--mut:#98A3B2;--line:#2C3743;--acc:#4DB3AA;--bad:#E27A93;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h1,h2{margin:0 0 8px}h1{font-size:22px}h2{font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}.btn.d{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.slots button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer}
.slots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mut{color:var(--mut)}.err{color:var(--bad)}.ok{color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row>div{flex:1;min-width:0}.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.bar h2{flex:1;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:0;border-radius:14px;padding:16px;width:min(420px,94vw);background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.45)}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}
</style>
</head>
<body>
<main id="m"></main>
<dialog id="d"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://arkwtpihdaqnwhdcjpqf.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3d0cGloZGFxbndoZGNqcHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NDQwMzAsImV4cCI6MjEwOTMyMDAzMH0.5Zr3uZYUb00QxkbiQzexuEAfrab4tML8yAkcrpzNguY';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),M=$('#m'),D=$('#d');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Math.round(n||0).toLocaleString('uk-UA')+' ₴';
const HS=9,HE=21,P=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate());
const loc=(day,min)=>new Date(day+'T'+P(Math.floor(min/60))+':'+P(min%60)+':00');
const hm=iso=>new Date(iso).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
const opt=(a,f=x=>x.name)=>a.map(x=>`<option value="${x.id}">${E(f(x))}</option>`).join('');
function dlg(html,ok){D.innerHTML='<form method="dialog">'+html+'<div class="bar" style="margin-top:14px"><span style="flex:1"></span><button type="button" class="btn g" id="cx">Скасувати</button><button class="btn">Зберегти</button></div></form>';
  $('#cx').onclick=()=>D.close();D.querySelector('form').onsubmit=async e=>{e.preventDefault();const r=await ok(Object.fromEntries(new FormData(e.target)));if(r!==false)D.close()};D.showModal()}

async function clientView(){
  const[{data:masters},{data:services}]=await Promise.all([sb.from('masters').select('id,name'),sb.from('services').select('*').order('name')]);
  if(!masters||!services){M.innerHTML='<div class="card err">Не вдалося завантажити дані. Перевірте налаштування Supabase.</div>';return}
  const today=ymd(new Date()),max=ymd(new Date(Date.now()+60*864e5));let pick=null;
  M.innerHTML=`<div class="card"><h1>Онлайн-запис</h1><p class="mut" style="margin:0">Оберіть послугу, майстра та зручний час.</p>
  <label>Послуга</label><select id="sv">${opt(services,s=>`${s.name} · ${s.dur} хв · ${s.price} ₴`)}</select>
  <label>Майстер</label><select id="ms">${opt(masters)}</select>
  <label>Дата</label><input type="date" id="dt" min="${today}" max="${max}" value="${today}">
  <label>Вільний час</label><div class="slots" id="sl"></div></div>
  <div class="card" id="fm" hidden><h2>Ваші дані</h2><label>Ім’я</label><input id="nm" autocomplete="name"><label>Телефон</label><input id="ph" type="tel" autocomplete="tel" placeholder="+380…">
  <p id="msg" class="err"></p><button class="btn" id="go" style="width:100%">Записатися</button></div>`;
  const slots=async()=>{
    pick=null;$('#fm').hidden=true;$('#sl').innerHTML='<span class="mut">Завантаження…</span>';
    const day=$('#dt').value,s=services.find(x=>x.id===$('#sv').value),from=loc(day,HS*60),to=loc(day,HE*60);
    const{data:busy}=await sb.rpc('busy_slots',{p_master:$('#ms').value,p_from:from.toISOString(),p_to:to.toISOString()});
    let h='';for(let m=HS*60;m+s.dur<=HE*60;m+=30){
      const a=loc(day,m),b=new Date(a.getTime()+s.dur*6e4);
      if(a<new Date()||(busy||[]).some(x=>new Date(x.starts_at)<b&&new Date(x.ends_at)>a))continue;
      h+=`<button data-t="${a.toISOString()}">${P(Math.floor(m/60))}:${P(m%60)}</button>`}
    $('#sl').innerHTML=h||'<span class="mut">На цей день вільних годин немає. Спробуйте іншу дату.</span>';
    $('#sl').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#sl').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');pick=b.dataset.t;$('#fm').hidden=false;$('#fm').scrollIntoView({behavior:'smooth'})})};
  ['#sv','#ms','#dt'].forEach(i=>$(i).onchange=slots);slots();
  $('#go').onclick=async()=>{
    $('#go').disabled=true;$('#msg').textContent='';
    const{error}=await sb.rpc('book',{p_master:$('#ms').value,p_service:$('#sv').value,p_start:pick,p_name:$('#nm').value,p_phone:$('#ph').value});
    if(error){$('#msg').textContent=error.message;$('#go').disabled=false;slots();return}
    M.innerHTML=`<div class="card"><h1 class="ok">Ви записані!</h1><p>Чекаємо на вас ${new Date(pick).toLocaleString('uk-UA',{dateStyle:'long',timeStyle:'short'})}.</p><button class="btn g" onclick="clientView()">Новий запис</button></div>`};
}

let me=null,sday=ymd(new Date()),masters=[],services=[];
async function staffView(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){M.innerHTML=`<div class="card"><h1>Вхід для персоналу</h1><label>Email</label><input id="em" type="email"><label>Пароль</label><input id="pw" type="password"><p id="msg" class="err"></p><button class="btn" id="li" style="width:100%">Увійти</button></div>`;
    $('#li').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?$('#msg').textContent='Невірний email або пароль':staffView()};return}
  const{data:pr}=await sb.from('profiles').select('role').eq('user_id',session.user.id).maybeSingle();
  if(!pr){M.innerHTML='<div class="card err">У вашого акаунта немає доступу. Зверніться до власника.</div><button class="btn g" onclick="out()">Вийти</button>';return}
  [{data:masters},{data:services}]=await Promise.all([sb.from('masters').select('*').order('name'),sb.from('services').select('*').order('name')]);
  const mm=masters.find(x=>x.user_id===session.user.id);me={role:pr.role,master:mm&&mm.id};dayView();
}
window.out=async()=>{await sb.auth.signOut();staffView()};
async function dayView(){
  const a=loc(sday,0),b=loc(sday,1440),f=a.toISOString(),t=b.toISOString();
  const[{data:ap},{data:bl}]=await Promise.all([
    sb.from('appointments').select('*,clients(name,phone),services(name,price)').gte('starts_at',f).lt('starts_at',t).order('starts_at'),
    sb.from('blocks').select('*').lt('starts_at',t).gt('ends_at',f).order('starts_at')]);
  const shift=n=>{const d=new Date(sday+'T12:00');d.setDate(d.getDate()+n);sday=ymd(d);dayView()};
  const card=m=>{
    const mine=m.id===me.master||me.role==='owner',items=[
      ...(ap||[]).filter(x=>x.master_id===m.id).map(x=>({t:x.starts_at,h:`<div class="row"><div><b>${hm(x.starts_at)}–${hm(x.ends_at)} ${E(x.clients.name)}</b> <span class="pill">${x.status==='done'?'виконано':x.status==='cancel'?'скасовано':'заплановано'}</span><br><span class="mut">${E(x.services.name)}${mine?' · '+E(x.clients.phone):''}${x.status==='done'?' · оплата '+money(x.paid_amount):''}${x.source==='online'?' · онлайн':''}</span></div>${mine&&x.status==='planned'?`<button class="btn s" data-done="${x.id}">Завершити</button><button class="btn g s" data-cancel="${x.id}">✕</button>`:''}</div>`})),
      ...(bl||[]).filter(x=>x.master_id===m.id).map(x=>({t:x.starts_at,h:`<div class="row"><div><b>🔒 ${hm(x.starts_at)}–${hm(x.ends_at)} закрито</b><br><span class="mut">${E(x.reason)}</span></div>${mine?`<button class="btn d s" data-unb="${x.id}">Відкрити</button>`:''}</div>`}))
    ].sort((p,q)=>p.t<q.t?-1:1);
    return`<div class="card"><div class="bar"><h2>${E(m.name)}${m.id===me.master?' (ви)':''}</h2>${mine?`<button class="btn s" data-add="${m.id}">+ Запис</button><button class="btn g s" data-blk="${m.id}">Закрити час</button>`:''}</div>${items.map(i=>i.h).join('')||'<span class="mut">Записів немає</span>'}</div>`};
  const order=[...masters].sort((x,y)=>(y.id===me.master)-(x.id===me.master));
  M.innerHTML=`<div class="bar"><h2>${me.role==='owner'?'Власник':'Мій день'}</h2><button class="btn g s" onclick="out()">Вийти</button></div>
  <div class="bar"><button class="btn g s" id="pv">←</button><input type="date" id="sd" value="${sday}"><button class="btn g s" id="nx">→</button></div>
  ${me.role==='owner'?'<div id="st"></div>':''}${order.map(card).join('')}`;
  $('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);$('#sd').onchange=e=>{sday=e.target.value||sday;dayView()};
  const q=(s,fn)=>M.querySelectorAll(s).forEach(el=>el.onclick=()=>fn(el));
  q('[data-add]',e=>addForm(e.dataset.add));q('[data-blk]',e=>blockForm(e.dataset.blk));
  q('[data-done]',e=>{const x=ap.find(z=>z.id===e.dataset.done);dlg(`<h2>Завершити візит</h2><label>Сума оплати, ₴</label><input name="amt" type="number" min="0" value="${x.services.price}" required><label>Спосіб оплати</label><select name="pm"><option>Готівка</option><option>Картка</option></select>`,async d=>{const{error}=await sb.from('appointments').update({status:'done',paid_amount:+d.amt,pay_method:d.pm}).eq('id',x.id);if(error)return alert(error.message)||false;dayView()})});
  q('[data-cancel]',e=>confirm('Скасувати запис?')&&sb.from('appointments').update({status:'cancel'}).eq('id',e.dataset.cancel).then(dayView));
  q('[data-unb]',e=>confirm('Відкрити цей час для запису?')&&sb.from('blocks').delete().eq('id',e.dataset.unb).then(dayView));
  if(me.role==='owner')stats();
}
function addForm(mid){
  dlg(`<h2>Новий запис</h2><label>Ім’я клієнта</label><input name="n" required><label>Телефон</label><input name="p" type="tel" required><label>Послуга</label><select name="s">${opt(services,s=>s.name+' · '+s.dur+' хв')}</select><div class="two"><div><label>Дата</label><input name="d" type="date" value="${sday}"></div><div><label>Час</label><input name="t" type="time" value="10:00" step="900"></div></div>`,
  async d=>{const s=services.find(x=>x.id===d.s),st=new Date(d.d+'T'+d.t),en=new Date(st.getTime()+s.dur*6e4);
    const{data:busy}=await sb.rpc('busy_slots',{p_master:mid,p_from:st.toISOString(),p_to:en.toISOString()});
    if(busy&&busy.length&&!confirm('Цей час зайнятий або закритий. Все одно записати?'))return false;
    const{data:c,error:e1}=await sb.from('clients').upsert({name:d.n,phone:d.p.replace(/[^\d+]/g,'')},{onConflict:'phone'}).select().single();
    if(e1)return alert(e1.message)||false;
    const{error}=await sb.from('appointments').insert({master_id:mid,service_id:s.id,client_id:c.id,starts_at:st.toISOString(),ends_at:en.toISOString(),source:'staff'});
    if(error)return alert(error.message)||false;sday=d.d;dayView()});
}
function blockForm(mid){
  dlg(`<h2>Закрити час для запису</h2><label>Дата</label><input name="d" type="date" value="${sday}"><div class="two"><div><label>З</label><input name="a" type="time" value="09:00"></div><div><label>До</label><input name="b" type="time" value="21:00"></div></div><label>Причина (обов’язково)</label><input name="r" required placeholder="Відпустка, лікар, навчання…">`,
  async d=>{const a=new Date(d.d+'T'+d.a),b=new Date(d.d+'T'+d.b);if(b<=a)return alert('Кінець має бути пізніше початку')||false;
    const{error}=await sb.from('blocks').insert({master_id:mid,starts_at:a.toISOString(),ends_at:b.toISOString(),reason:d.r.trim()});
    if(error)return alert(error.message)||false;sday=d.d;dayView()});
}
async function stats(){
  const n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1).toISOString();
  const{data}=await sb.from('appointments').select('status,paid_amount,source,client_id').gte('starts_at',f);
  const done=(data||[]).filter(x=>x.status==='done'),rev=done.reduce((s,x)=>s+ +x.paid_amount,0);
  const{count}=await sb.from('clients').select('*',{count:'exact',head:true});
  $('#st').innerHTML=`<div class="card"><h2>Цей місяць</h2><div class="two"><div><b style="font-size:22px">${money(rev)}</b><br><span class="mut">виручка</span></div><div><b style="font-size:22px">${done.length?money(rev/done.length):'—'}</b><br><span class="mut">середній чек</span></div><div><b style="font-size:22px">${done.length}</b><br><span class="mut">виконано візитів</span></div><div><b style="font-size:22px">${(data||[]).filter(x=>x.source==='online').length}</b><br><span class="mut">онлайн-записів (усього клієнтів: ${count||0})</span></div></div></div>`;
}
const route=()=>location.hash==='#staff'?staffView():clientView();
addEventListener('hashchange',route);route();
</script>
</body>
</html>
